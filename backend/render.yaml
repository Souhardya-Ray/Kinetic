services:
  - type: web
    name: material-mgmt-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: MONGO_URL
        sync: false                          # ⚠️ paste your MongoDB Atlas URL in Render dashboard
      - key: FRONTEND_URL
        value: https://kinetic-silk.vercel.app  # set directly — not a secret
